syntax = "proto3";

package airport.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/sakura-skytree/sakura-airlines-contracts/gen/go/airport/v1;airportv1";

service AirportService {
  rpc CreateAirport(CreateAirportRequest) returns(CreateAirportResponse);

  rpc GetAirports(GetAirportsRequest) returns(GetAirportsResponse);
  rpc GetAirportById(GetAirportByIdRequest) returns(GetAirportByIdResponse);
  rpc GetAirportByIcao(GetAirportByIcaoRequest) returns(GetAirportByIcaoResponse);
  rpc GetAirportByIata(GetAirportByIataRequest) returns(GetAirportByIataResponse);

  rpc DeleteAirport(DeleteAirportRequest) returns(google.protobuf.Empty);
  rpc UpdateAirport(UpdateAirportRequest) returns(UpdateAirportResponse);
}

message Airport {
  string id = 1;
  string iata_code = 2;
  string icao_code = 3;
  string name = 4;
  string city = 5;
  string country = 6;
  string timezone = 7;
  float latitude = 8;
  float longitude = 9;
}

message CreateAirportRequest {
  string iata_code = 1;
  string icao_code = 2;
  string name = 3;
  string city = 4;
  string country = 5;
  string timezone = 6;
  float latitude = 7;
  float longitude = 8;
}

message CreateAirportResponse {
  Airport airport = 1;
}

message GetAirportsRequest {
  optional string city = 1;
  optional string country = 2;
}

message GetAirportsResponse {
  repeated Airport airports = 1;
}

message GetAirportByIdRequest {
  string id = 1;
}

message GetAirportByIdResponse {
  Airport airport = 1;
}

message GetAirportByIcaoRequest {
  string icao = 1;
}

message GetAirportByIcaoResponse {
  Airport airport = 1;
}

message GetAirportByIataRequest {
  string iata = 1;
}

message GetAirportByIataResponse {
 Airport airport = 1;
}

message DeleteAirportRequest {
  string id = 1;
}

message UpdateAirportRequest {
  string id = 1;
  optional string name = 2;
  optional string city = 3;
  optional string country = 4;
  optional string timezone = 5;
  optional float latitude = 6;
  optional float longitude = 7;
}

message UpdateAirportResponse {
  Airport airport = 1;
}
